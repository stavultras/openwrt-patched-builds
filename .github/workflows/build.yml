name: Build patched OpenWrt images

on:
  schedule:
    - cron: '17 3 * * *'        # daily, 03:17 UTC (06:17 Moscow)
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version (empty = latest stable)'
        required: false
      force:
        description: 'Rebuild even if a release already exists'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write                # keepalive: re-enable this workflow via the API

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the (still enabled) workflow every run resets that timer.
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable" || echo "::warning::keepalive failed"

      - name: Find version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER=$(curl -fsSL https://downloads.openwrt.org/.versions.json | jq -r .stable_version)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Release v$VER already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cudy WR3000 v1 (64 MB NOR)
            id: wr3000-64m
            target: mediatek/filogic
            profile: cudy_wr3000-v1
            image_name: cudy_wr3000-v1-64mb-nor   # replaces the profile name in the output file name
            dtb: mt7981b-cudy-wr3000-v1
            patch: patches/Cudy-WR3000-V1-64MB-NOR.patch
            overlay: overlays/cudy-wr3000-v1-64m.dtso
            kernel: fit               # prebuilt kernel FIT embeds the DTB, rebuild it
            image_size: 64576k        # 0x3f10000 "firmware" partition, was 15424k
            packages: 'luci'          # IB defaults lack LuCI; no luci-app-attendedsysupgrade (it would fetch stock images)
            checks: |
              / model Cudy WR3000 v1 64MB NOR
              /soc/spi@11009000/flash@0/partitions/partition@f0000 reg 983040 66125824
          - name: Cudy WR3000 v1 (128 MB NAND)
            id: wr3000-128m-nand
            target: mediatek/filogic
            profile: cudy_wr3000s-v1-ubootmod   # same NAND layout, BL2 and sysupgrade as the WR3000S ubootmod
            image_name: cudy_wr3000-v1-128mb-nand
            dtb: mt7981b-cudy-wr3000s-v1-ubootmod
            patch: patches/Cudy-WR3000-V1-128MB-NAND.patch
            overlay: overlays/cudy-wr3000-v1-128mb-nand.dtso
            kernel: ''                # DTB goes into the sysupgrade FIT directly
            delete_nodes: |
              /leds/led-wps
              /leds/led-wlan2g
              /leds/led-wlan5g
              /soc/ethernet@15100000/mdio-bus/switch@1f/ports/port@4
            image_size: ''
            files: files/cudy-wr3000-v1-128mb-nand   # LED defaults for the WR3000 v1 LEDs
            recovery: true            # official initramfs-recovery.itb with our DTB, for U-Boot TFTP recovery
            packages: 'luci'
            checks: |
              / model Cudy WR3000 v1 128MB NAND
              /leds/led-internet label blue:internet
              /leds/led-wan function wan
              /soc/spi@1100a000/flash@0/partitions/partition@5c0000 label ubi
          - name: netis NX30 v2 (USB soldered)
            id: nx30v2-usb
            target: mediatek/filogic
            profile: netis_nx30v2
            image_name: netis_nx30-v2-usb
            dtb: mt7981b-netis-nx30v2
            patch: patches/netis-NX30-V2-USB.patch
            overlay: overlays/netis-nx30v2-usb.dtso
            kernel: ''                # DTB goes into the sysupgrade FIT directly
            image_size: ''
            packages: 'luci kmod-usb3' # kmod-usb3 = xhci-mtk driver; add kmod-usb-storage etc. as needed
            checks: |
              / model netis NX30 V2 USB
              /regulator-usb regulator-name usb-vbus
              /soc/usb@11200000 status okay
              /soc/usb-phy@11e10000 status okay
          - name: Xiaomi Mi Router 4A Gigabit v2 (32 MB NOR)
            id: r4a-gigabit-v2-32m
            target: ramips/mt7621
            profile: xiaomi_mi-router-4a-gigabit-v2
            image_name: xiaomi_mi-router-4a-gigabit-v2-32mb
            dtb: mt7621_xiaomi_mi-router-4a-gigabit-v2
            patch: patches/Xiaomi-R4A-Gigabit-V2-32MB.patch
            overlay: overlays/xiaomi-r4a-gigabit-v2-32mb.dtso
            kernel: lzma-loader       # DTB is appended to the compressed kernel
            delete_nodes: |
              /palmbus@1e000000/spi@b00/flash@0/partitions/partition@ff0000
            image_size: 31232k          # 0x1e80000 "firmware" partition, was 14784k
            packages: 'luci'
            checks: |
              / model Xiaomi Mi Router 4A Gigabit Edition v2 32MB NOR
              /palmbus@1e000000/spi@b00/flash@0/partitions/partition@180000 reg 1572864 31981568
          - name: Xiaomi Mi Router 4A Gigabit v2 (64 MB NOR)
            id: r4a-gigabit-v2-64m
            target: ramips/mt7621
            profile: xiaomi_mi-router-4a-gigabit-v2
            image_name: xiaomi_mi-router-4a-gigabit-v2-64mb
            dtb: mt7621_xiaomi_mi-router-4a-gigabit-v2
            patch: patches/Xiaomi-R4A-Gigabit-V2-64MB.patch
            overlay: overlays/xiaomi-r4a-gigabit-v2-64mb.dtso
            kernel: lzma-loader       # DTB is appended to the compressed kernel
            delete_nodes: |
              /palmbus@1e000000/spi@b00/flash@0/partitions/partition@ff0000
            image_size: 64000k          # 0x3e80000 "firmware" partition, was 14784k
            packages: 'luci'
            checks: |
              / model Xiaomi Mi Router 4A Gigabit Edition v2 64MB NOR
              /palmbus@1e000000/spi@b00/flash@0/partitions/partition@180000 reg 1572864 65536000
    name: ${{ matrix.name }}
    env:
      VER: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      PROFILE: ${{ matrix.profile }}
      DTB_NAME: ${{ matrix.dtb }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler zstd u-boot-tools

      # The DTB is edited with an overlay, so make sure the patch it mirrors
      # still applies to this release's DTS. If it doesn't, upstream changed
      # the board and the overlay must be reviewed.
      - name: Check patch against upstream DTS
        run: |
          mkdir upstream
          for f in $(sed -n 's|^+++ b/||p' "${{ matrix.patch }}"); do
            mkdir -p "upstream/$(dirname "$f")"
            curl -fsSL "https://raw.githubusercontent.com/openwrt/openwrt/v$VER/$f" -o "upstream/$f"
          done
          patch -d upstream -p1 --dry-run < "${{ matrix.patch }}"

      - name: Download ImageBuilder
        run: |
          BASE="https://downloads.openwrt.org/releases/$VER/targets/$TARGET"
          NAME="openwrt-imagebuilder-$VER-${TARGET/\//-}.Linux-x86_64"
          curl -fLO "$BASE/$NAME.tar.zst" || curl -fLO "$BASE/$NAME.tar.xz"
          mkdir ib && tar -xaf "$NAME".tar.* -C ib --strip-components=1

      - name: Patch DTB
        working-directory: ib
        run: |
          DTB=$(find build_dir -name "image-$DTB_NAME.dtb" | head -n1)
          [ -n "$DTB" ] || { echo "DTB not found"; exit 1; }
          dtc -q -@ -I dts -O dtb -o overlay.dtbo "$GITHUB_WORKSPACE/${{ matrix.overlay }}"
          dtc -q -I dtb -O dts -o before.dts "$DTB"
          fdtoverlay -i "$DTB" -o patched.dtb overlay.dtbo
          while read -r node; do
            [ -n "$node" ] || continue
            fdtput -r patched.dtb "$node"
            ! fdtget -l patched.dtb "$node" >/dev/null 2>&1 || { echo "failed to delete $node"; exit 1; }
          done <<< "${{ matrix.delete_nodes }}"
          dtc -q -I dtb -O dts -o after.dts patched.dtb
          diff -u before.dts after.dts || true
          while read -r node prop want; do
            [ -n "$node" ] || continue
            got=$(fdtget patched.dtb "$node" "$prop")
            [ "$got" = "$want" ] || { echo "$node $prop: got '$got', want '$want'"; exit 1; }
          done <<< "${{ matrix.checks }}"
          cp patched.dtb "$DTB"

      # ImageBuilder never rebuilds the kernel, so profiles whose prebuilt
      # kernel embeds the DTB would ship the stock DTB:
      # - fit: rebuild the kernel FIT from the shipped .its with our DTB
      # - lzma-loader: swap the LZMA(vmlinux + DTB) inside the prebuilt loader
      - name: Rebuild kernel
        if: matrix.kernel != ''
        working-directory: ib
        run: |
          KDIR=$(dirname "$(find build_dir -name "image-$DTB_NAME.dtb" | head -n1)")
          HOST=$PWD/staging_dir/host/bin
          case "${{ matrix.kernel }}" in
          fit)
            ITS="$KDIR/$PROFILE-kernel.bin.its"
            grep -q "image-$DTB_NAME.dtb" "$ITS" || { echo "$ITS does not use the DTB"; exit 1; }
            "$HOST/lzma" e "$KDIR/Image" -lc1 -lp2 -pb2 kernel.lzma
            sed -e "s|\"[^\"]*/$PROFILE-kernel.bin\"|\"$PWD/kernel.lzma\"|" \
                -e "s|\"[^\"]*/image-|\"$PWD/$KDIR/image-|" "$ITS" > kernel.its
            grep incbin kernel.its
            # reuse the official FIT's timestamp so rebuilds are byte-identical
            export SOURCE_DATE_EPOCH=$(fdtget -t u "$KDIR/$PROFILE-kernel.bin" / timestamp)
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -ud @$SOURCE_DATE_EPOCH))"
            "$HOST/mkimage" -f kernel.its "$KDIR/$PROFILE-kernel.bin"
            ;;
          lzma-loader)
            python3 "$GITHUB_WORKSPACE/scripts/lzma-loader.py" repack \
              "$KDIR/$PROFILE-kernel.bin" "$KDIR/vmlinux" patched.dtb "$HOST/lzma"
            ;;
          *) echo "unknown kernel type"; exit 1 ;;
          esac

      - name: Raise IMAGE_SIZE
        if: matrix.image_size != ''
        working-directory: ib
        run: |
          MK=$(grep -l "^define Device/$PROFILE\$" target/linux/*/image/*.mk)
          sed -i "/^define Device\/$PROFILE\$/,/^endef/ s/^\(\s*IMAGE_SIZE :=\).*/\1 ${{ matrix.image_size }}/" "$MK"
          sed -n "/^define Device\/$PROFILE\$/,/^endef/p" "$MK"
          grep -q "IMAGE_SIZE := ${{ matrix.image_size }}" "$MK" || { echo "IMAGE_SIZE patch failed"; exit 1; }

      - name: Build image
        working-directory: ib
        run: |
          make image PROFILE="$PROFILE" PACKAGES="${{ matrix.packages }}" \
            ${{ matrix.files && format('FILES="{0}/{1}"', github.workspace, matrix.files) || '' }}

      # ImageBuilder can't build initramfs images: take the official recovery
      # image of the profile and put our DTB into it, for U-Boot's TFTP recovery
      - name: Build recovery image
        if: matrix.recovery
        working-directory: ib
        run: |
          BASE="https://downloads.openwrt.org/releases/$VER/targets/$TARGET"
          REC="openwrt-$VER-${TARGET/\//-}-$PROFILE-initramfs-recovery.itb"
          curl -fLO "$BASE/$REC"
          curl -fsSL "$BASE/sha256sums" | grep " \*$REC\$" | sha256sum -c
          sh "$GITHUB_WORKSPACE/scripts/recovery-fit.sh" "$REC" patched.dtb \
            "bin/targets/$TARGET/$REC" staging_dir/host/bin/mkimage
          dumpimage -l "bin/targets/$TARGET/$REC"

      - name: Collect images
        run: |
          mkdir out
          for f in ib/bin/targets/$TARGET/*"$PROFILE"*{sysupgrade,recovery}*; do
            [ -e "$f" ] || continue
            f=$(basename "$f")
            cp "ib/bin/targets/$TARGET/$f" "out/${f/$PROFILE/${{ matrix.image_name }}}"
          done
          ls -l out
          # verbatim in a FIT, or inside the LZMA stream of an lzma-loader kernel
          for f in out/*; do
            python3 scripts/lzma-loader.py contains "$f" ib/patched.dtb \
              || { echo "$f does not contain the patched DTB"; exit 1; }
            echo "$f contains the patched DTB"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: out/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum * > sha256sums
          cat sha256sums
          cat > notes.md <<'EOF'
          Unofficial OpenWrt builds for modified hardware. Flash only the image that matches your mod.

          - `*cudy_wr3000-v1-64mb-nor-squashfs-sysupgrade.bin`: Cudy WR3000 v1 with the 16 MB NOR replaced by a **64 MB** NOR. Do NOT flash on stock 16 MB boards.
          - `*cudy_wr3000-v1-128mb-nand-squashfs-sysupgrade.itb`: Cudy WR3000 v1 with the NOR replaced by a **128 MB SPI-NAND** (ESMT F50L1G41LB), running the OpenWrt BL2/U-Boot from `bootloader/` in this repository. `*-initramfs-recovery.itb` is its TFTP recovery image. First install: see the README.
          - `*netis_nx30-v2-usb-squashfs-sysupgrade.itb`: netis NX30 V2 with a **soldered USB port** (USB 2.0, VBUS on GPIO 14). Includes kmod-usb3.
          - `*xiaomi_mi-router-4a-gigabit-v2-32mb-squashfs-sysupgrade.bin`: Xiaomi Mi Router 4A Gigabit Edition v2 with a **32 MB** NOR, booted by **Breed or U-Boot**. Do NOT flash on stock 16 MB boards.
          - `*xiaomi_mi-router-4a-gigabit-v2-64mb-squashfs-sysupgrade.bin`: Xiaomi Mi Router 4A Gigabit Edition v2 with a **64 MB** NOR, booted by **U-Boot** (Breed doesn't support 64 MB). Do NOT flash on stock 16 MB boards.

          All images include LuCI. Attended Sysupgrade is intentionally left out: it would install stock images and undo the mods.

          **Unofficial, use at your own risk, no warranty.** Not supported by OpenWrt, Cudy, netis or Xiaomi. See the README for details. License: GPL-2.0.
          EOF
          gh release delete "v$VER" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" -R "$GITHUB_REPOSITORY" \
            --title "OpenWrt $VER — patched builds" \
            --notes-file notes.md \
            *sysupgrade* *recovery* sha256sums
